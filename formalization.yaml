      lean: "WrittenOnTheWallII.GraphConjecture372.additive_of_two_le"
      module: "Solution"
      status: "proved"
      note: >-
        Strictly strengthens WOWII #372 for every p(T) ≥ 3 and coincides with the
        two-path theorem at p(T) = 2; sharp for every p ≥ 2 (equality trees verified
        on paper and computationally, not formalized in Lean).
    - source: "WOWII Conjecture 372 (positive-denominator domain)"
      lean: "WrittenOnTheWallII.GraphConjecture372.conjecture372"
